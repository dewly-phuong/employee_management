[project]
name = "employee-management"
version = "0.1.0"
description = "Application for manage employee in company"
authors = [
  {name= "dewly-phuong",email= "phuong.truong@dewly.ai"}
]
readme = "README.md"

requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "motor (>=3.7.1,<4.0.0)",
    "beanie (>=2.1.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "PyJWT (>=2.8.0,<3.0.0)",
    "python-multipart (>=0.0.9,<0.1.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)"
]
[tool.poetry]
packages = [
  { include = "employee_management", from = "src" }
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.12,<0.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
